<main>
  <app-carrousel
    [images]="product?.images"
    [videos]="product?.videos"
  ></app-carrousel>

  <section class="main-info">
    <app-main-info [product]="product"></app-main-info>

    <aside class="main-info-contact" aria-labelledby="detail-contact-title">
      <h2 id="detail-contact-title">¿Te interesa esta propiedad?</h2>
      <app-contact-form subject="Comprar este inmueble"></app-contact-form>
      <app-contact-card></app-contact-card>
      <app-button
        (click)="copyActualRoute()"
        text=" Copiar URL de la propiedad"
        icon="fa fa-solid fa-link"
      ></app-button>
      <app-button
        icon="fa fa-file-arrow-down"
        text="Descargar PDF de propiedad"
        (click)="downLoadPdf()"
      ></app-button>
    </aside>
  </section>

  <!-- <app-suggestions></app-suggestions> -->
</main>
