name: Tests

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Generate production environment
        shell: bash
        env:
          TOKKOBROKER_KEY: ${{ secrets.TOKKOBROKER_KEY }}
          SANITY_KEY: ${{ secrets.SANITY_KEY }}
          MAPS_KEY: ${{ secrets.MAPS_KEY }}
          MAIL_API_PROD: ${{ secrets.MAIL_API_PROD }}
        run: |
          mkdir -p src/environments
          cat > src/environments/environment.prod.ts <<EOF
          export const environment = {
            production: true,
            TOKKOBROKER_KEY: '${TOKKOBROKER_KEY}',
            sanity_key: '${SANITY_KEY}',
            mail_api_dev: 'http://localhost:3000',
            mail_api_prod: '${MAIL_API_PROD:-https://mailing-api.fly.dev}',
            maps_key: '${MAPS_KEY}',
          }
          EOF

      - name: Run unit tests with coverage
        run: npm run test:prod

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: ./coverage/pau-dallochio-landing-page/lcov.info
