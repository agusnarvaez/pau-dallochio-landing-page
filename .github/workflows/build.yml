name: QA
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint-build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate production environment file
        run: |
          cat > src/environments/environment.prod.ts << 'EOF'
          export const environment = {
            production: true,
            TOKKOBROKER_KEY: '${{ secrets.TOKKOBROKER_KEY }}',
            sanity_key: '${{ secrets.SANITY_KEY }}',
            mail_api_dev: 'http://localhost:3000',
            mail_api_prod: '${{ secrets.MAIL_API_PROD }}',
            maps_key: '${{ secrets.MAPS_KEY }}',
          }
          EOF

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/pau-dallochio-landing-page/lcov.info
          fail_ci_if_error: false
