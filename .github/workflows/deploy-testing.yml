name: deploy-testing
on:
  push: { branches: [main] }
permissions:
  contents: read
# Sin qa/security en GitHub (sin minutos pagos): los corre el pre-push local. Volver a sumarlos: ver bapps-console docs/setup/rollout-fase-2.md.
jobs:
  deploy:
    uses: agusnarvaez/bapps-workflows/.github/workflows/deploy-vps.yml@v1
    with: { app: pau-dallochio, env: testing, health-url: 'https://pau-dallochio-testing.bapps.com.ar/version.json', build-command: 'REQUIRE_BUILD_ENV=1 npm run build', build-dir: dist/pau-dallochio-landing-page/browser }
    secrets: inherit
